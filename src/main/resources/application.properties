spring.application.name=portal
server.port=8080

# Finish in-flight requests before a replica stops (deploys, scale-in)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# The full JDBC URL, user and password included, comes from the DATABASE_URL secret.
# Without it, the app uses a local MySQL 8.4 in Docker (see the guide's "Run it locally").
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/unicloud?user=root&password=dev&sslMode=REQUIRED}
# 10 replicas x 15 connections stays under the 171 that MySQL B1ms allows
spring.datasource.hikari.maximum-pool-size=15

# Flyway creates and upgrades the tables; Hibernate only checks the entities against them
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#JWT
app.jwt.issuer=unicloud-portal
app.jwt.audience=unicloud-api
app.jwt.ttl-minutes=30
app.jwt.private-key=file:./secrets/private.pem
app.jwt.public-key=file:./secrets/public.pem


